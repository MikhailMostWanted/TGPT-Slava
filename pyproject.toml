[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tgpt-slava"
version = "0.1.0"
description = "Independent read-only Telegram MCP server for Slava"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastmcp-slim[server]==4.0.11",
  "Telethon==1.45.0",
  "python-socks[asyncio]>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "fastmcp-slim[client]==4.0.11"]

[project.scripts]
telegram-reader = "telegram_reader.__main__:main"

[tool.setuptools.packages.find]
include = ["telegram_reader*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
